# Ambiente local de desenvolvimento (na Vercel o deploy usa vercel.json, não este arquivo).
# O banco é SQLite (arquivo), então não há serviço de banco de dados.
services:
  app:
    build: .
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8080:80"
    volumes:
      # Persiste o arquivo SQLite entre recriações do container
      - inventai-data:/var/www/html/backend/database/data
    networks:
      default:
        # Alias usado pelo robot-runner: o Chromium força HTTPS em "app" (TLD .app tem HSTS pré-carregado).
        aliases: [investai-web]

  # Executor do Robot Framework: sem porta publicada, só o app o alcança pela rede interna.
  robot-runner:
    build:
      context: ./tests-robot
      dockerfile: runner/Dockerfile
    env_file: ./tests-robot/.env
    environment:
      # "localhost" dentro do container seria o próprio runner; host.docker.internal chega na porta 8080 publicada no host.
      ROBOT_BASE_URL: http://host.docker.internal:8080
      RUNNER_TOKEN: ${TEST_RUNNER_TOKEN:?defina TEST_RUNNER_TOKEN no .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - robot_results:/robot/results
      - ./tests-robot/tests:/robot/tests:ro
      - ./tests-robot/resources:/robot/resources:ro
    depends_on:
      - app

volumes:
  inventai-data:
  robot_results:
